[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loraforge-918"
version = "1.0.0"
description = "918 Technologies standalone LoRA/QLoRA fine-tuning workbench"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "918 Technologies"}]
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers==4.57.6", "peft==0.18.1", "accelerate>=1.5,<2", "safetensors>=0.5,<1"]
qlora = ["bitsandbytes>=0.45,<1"]

[project.scripts]
loraforge = "loraforge.cli:main"

[tool.setuptools.packages.find]
include = ["loraforge*"]

[tool.setuptools.package-data]
loraforge = ["web/*.html"]
